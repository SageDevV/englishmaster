name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Deploy Firebase Hosting and Firestore Rules
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service-account.json
          npx --yes firebase-tools@14.12.1 deploy --only hosting,firestore:rules --project englishmaster-ea9b9 --debug --non-interactive
        # Use shell: bash to ensure consistent behavior on Ubuntu
        shell: bash
